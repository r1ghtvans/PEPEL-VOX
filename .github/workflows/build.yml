name: Build Pepel Vox

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            cmake_args: -G "Visual Studio 17 2022" -A x64
          - name: macOS
            os: macos-latest
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Linux
            os: ubuntu-22.04
            cmake_args: -DCMAKE_BUILD_TYPE=Release

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build ${{ matrix.cmake_args }} -DCMAKE_BUILD_TYPE=Release -DPEPEL_BUILD_TOOLS=OFF
        shell: bash

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Collect artefacts
        shell: bash
        run: |
          mkdir -p dist
          cp -R build/PepelVox_artefacts/Release/VST3 dist/ 2>/dev/null || cp -R build/PepelVox_artefacts/VST3 dist/
          cp -R build/PepelVox_artefacts/Release/Standalone dist/ 2>/dev/null || cp -R build/PepelVox_artefacts/Standalone dist/ || true
          if [ "$RUNNER_OS" = "macOS" ]; then cp -R build/PepelVox_artefacts/Release/AU dist/ 2>/dev/null || cp -R build/PepelVox_artefacts/AU dist/ || true; fi
          cp README.md dist/
          cp Assets/OFL-*.txt dist/
          cd dist && ls -R | head -40

      - name: Zip
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../PepelVox-${{ matrix.name }}.zip . ; else zip -r -y ../PepelVox-${{ matrix.name }}.zip . ; fi

      - uses: actions/upload-artifact@v4
        with:
          name: PepelVox-${{ matrix.name }}
          path: PepelVox-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
